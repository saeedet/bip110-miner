# Bitcoin Knots (BLAKE2b fork) configuration — MAINNET
#
# Used via: ./scripts/node.sh start mainnet
#
# --- Read this before running it ------------------------------------------
#
# This chain shares Bitcoin's network magic (f9beb4d9), its P2P port (8333),
# and its DNS seeds. Two consequences follow, and they pull in opposite
# directions.
#
# The bad one: a datadir mix-up does not fail loudly. Point this config at a
# Bitcoin datadir and the node starts, connects, and quietly disagrees about
# which chain is real. Hence the dedicated ~/.btcb2, and hence the pool's
# refusal to mine on a node whose reported chain is not the one asked for.
#
# The good one: the two chains are byte-identical up to block 961,632, so
# every assumeutxo snapshot the release ships (840,000 / 880,000 / 910,000)
# is an ordinary *Bitcoin* snapshot. Any copy works, and `loadtxoutset`
# checks it against a hash compiled into the binary, so an untrusted mirror
# cannot feed a bad UTXO set.
#
# What keeps the chains apart on the wire is the NODE_BLAKE2B service bit
# (1 << 28). Knots prefers peers advertising it and demotes those without.
# Past the fork height a SHA-256d header is rejected outright —
# `bad-version-blake2b`, "New blocks require BLAKE2b PoW" — so Bitcoin's
# chain never becomes a competing candidate however much work it carries.

server=1

# --- Everything below is network-scoped -----------------------------------
#
# Knots refuses to start with a network-scoped setting at the top level of a
# config that selects a network. That refusal matters most for `prune`: a bare
# one that reads as scoped and is not is how an archive gets deleted.
[main]

# Keep only recent blocks. A miner needs the tip and the UTXO set, not the
# archive. Note this saves DISK, not BANDWIDTH — every block is still
# downloaded and validated on the way past.
#
# NEVER point this datadir at an archival blocks directory. Pruning deletes
# block files as it runs.
prune=10000

# BLAKE2b peers verified by version handshake on 2026-09-07, all reporting
# height 968,974 and services 0x10000c09:
#
#   /Satoshi:29.4.1/Knots:20260508/
#
# Discovery via the hardfork-aware DNS seeds works on mainnet — unlike
# testnet4, where one peer exists — so these are belt and braces rather than
# a necessity. They cost nothing and remove the seeds as a single point of
# failure on first start.
addnode=38.102.85.36:8333
addnode=206.128.67.69:8333
addnode=47.203.64.175:8333

# New-block notifications, so the pool can rebuild a template the moment the
# tip moves rather than polling into a stale one.
zmqpubhashblock=tcp://127.0.0.1:28344
