# Bitcoin Knots (BLAKE2b fork) configuration — REGTEST
#
# A private chain on this machine, where BLAKE2b activates at a height we
# choose. Difficulty is trivial, so the whole mine-and-submit path can be
# debugged in seconds instead of against a live network.
#
# Used via: ./scripts/node.sh start regtest

regtest=1

# JSON-RPC, for getblocktemplate / submitblock.
server=1

# --- Activate the hardfork ------------------------------------------------
#
# BLAKE2b is a flag-day hardfork with a hardcoded height on mainnet (961640)
# and testnet (150308). On regtest it is opt-in, so we choose when it happens.
#
# Height 10 rather than 1 deliberately: blocks 1-9 are mined with SHA256d and
# 10 onward with BLAKE2b, which reproduces the real transition and lets us
# verify both regimes and the switch between them.
testactivationheight=blake2b@10

# This chain's equivalent of Satoshi's newspaper headline, embedded at the
# fork. Mainnet uses "8-30 NYPost Deride And Conquer"; on regtest it is ours
# to set, and it must be set explicitly whenever blake2b is activated.
blake2b_headline=bip110-miner regtest

# No peers to talk to on a private chain.
listen=0

[regtest]
# Knots keeps Bitcoin's regtest RPC default.
rpcport=18443

# New-block notifications, so the pool can rebuild a template the moment the
# tip moves rather than polling into a stale one.
zmqpubhashblock=tcp://127.0.0.1:28342

# A fresh chain has no fee history to estimate from.
fallbackfee=0.0001
