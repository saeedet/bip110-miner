# Bitcoin Knots (BLAKE2b fork) configuration — TESTNET4
#
# Used via: ./scripts/node.sh start testnet4
#
# --- Why testnet4 and not testnet3 ---------------------------------------
#
# The fork exists on exactly one test network. `CTestNetParams` (testnet3)
# sets no `Blake2bHeight` at all, so BLAKE2b never activates there and there
# is nothing for this project to do on it. testnet4 activates at height
# 150,308.
#
# --- The hazard this file is mostly about ---------------------------------
#
# This fork shares Bitcoin's testnet4 network magic (1c163f28), its P2P port
# (48333), and its DNS seeds. Both chains are identical up to 150,308 and
# diverge after it, so a node bootstrapping from those seeds meets mostly
# *Bitcoin* nodes, which serve a chain this node will reject past the fork.
#
# The fork's answer is a service bit, NODE_BLAKE2B (1 << 28). Knots prefers
# peers advertising it for outbound slots and demotes those without it, and
# the hardfork-aware DNS seeds filter on `x10000009`. That works on mainnet,
# where such peers are plentiful.
#
# On testnet4 it barely works: as of 2026-09-07 exactly one reachable peer
# advertises NODE_BLAKE2B. Sjors Provoost's seed supports service filtering,
# knows 22 testnet4 nodes, and reports zero of them BLAKE2b. So the peer below
# is pinned explicitly rather than left to discovery — without it this node
# would very likely sync to 150,308 and stop.

testnet4=1

# JSON-RPC, for getblocktemplate / submitblock.
server=1

# --- Everything below is network-scoped -----------------------------------
#
# Knots refuses to start if a network-specific setting appears at the top
# level of a config that selects a network:
#
#   Error: Config setting for -addnode only applied on testnet4 network when
#   in [testnet4] section.
#
# That refusal is a good one. A bare `addnode=` or `prune=` in a file that
# also says `testnet4=1` reads as though it applies here, but historically it
# would have applied to *every* network the file was used with. Requiring the
# section makes the scope explicit rather than assumed — which matters most
# for `prune`, where the wrong scope means deleting an archive.
[testnet4]

# The one known BLAKE2b peer, verified by version handshake on 2026-09-07:
#   /Satoshi:29.4.1/Knots:20260508rc4/  services 0x10000c49  height 150601
#
# `addnode` rather than `connect`: this asks Knots to always keep a connection
# to it *in addition to* normal peer discovery. `connect` would use it
# exclusively and give up every other peer, including the ones serving the
# shared history below the fork height.
addnode=82.67.102.15:48333

# Keep only the most recent blocks. The chain is ~11 GB and this machine has
# room, but a miner needs the tip and the UTXO set, not the archive — and
# pruning saves disk, not bandwidth: every block is still downloaded and
# validated on the way past.
prune=2000

# New-block notifications, so the pool can rebuild a template the moment the
# tip moves rather than polling into a stale one.
zmqpubhashblock=tcp://127.0.0.1:28343

# A quiet test chain has little fee history to estimate from.
fallbackfee=0.0001
